name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "vendor/**"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Install static-linker toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "envhole") | .version'
          )"
          release_tag="v$package_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [[ "$release_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version" >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Build and smoke test
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          "./target/${{ matrix.target }}/release/envhole" --help >/dev/null
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          archive="envhole-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "stage/$archive" dist
          install -m 0755 \
            "target/${{ matrix.target }}/release/envhole" \
            "stage/$archive/envhole"
          install -m 0644 README.md LICENSE SECURITY.md "stage/$archive/"
          tar -C stage -czf "dist/$archive.tar.gz" "$archive"
          (
            cd dist
            sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi
          cd dist
          declare -A expected=(
            ["envhole-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz"]=1
            ["envhole-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz.sha256"]=1
            ["envhole-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz"]=1
            ["envhole-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz.sha256"]=1
          )
          shopt -s nullglob
          actual=(*)
          if [[ "${#actual[@]}" -ne "${#expected[@]}" ]]; then
            printf 'unexpected release asset count: %s\n' "${#actual[@]}" >&2
            exit 1
          fi
          for asset in "${actual[@]}"; do
            if [[ ! -v "expected[$asset]" ]]; then
              printf 'unexpected release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done
          sha256sum --check --strict ./*.sha256

          if existing="$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft \
              --jq .isDraft \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null
          )"; then
            if [[ "$existing" != true ]]; then
              echo "refusing to modify published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" \
              --yes \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release create "$GITHUB_REF_NAME" ./* \
            --draft \
            --generate-notes \
            --title "EnvHole $GITHUB_REF_NAME" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
